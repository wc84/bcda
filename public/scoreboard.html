<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCDA All Stars</title>
<meta name="description" content="Broward County Darts Association All Stars standings.">
<meta name="theme-color" content="#323232">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>
<div class="shell">

  <header class="masthead">
    <svg class="board" viewBox="0 0 100 100" aria-hidden="true">
      <g stroke="currentColor" stroke-width="2.5" fill="none">
        <line x1="3" y1="50" x2="97" y2="50"/>
        <line x1="9.3" y1="26.5" x2="90.7" y2="73.5"/>
        <line x1="26.5" y1="9.3" x2="73.5" y2="90.7"/>
        <line x1="50" y1="3" x2="50" y2="97"/>
        <line x1="73.5" y1="9.3" x2="26.5" y2="90.7"/>
        <line x1="90.7" y1="26.5" x2="9.3" y2="73.5"/>
        <circle cx="50" cy="50" r="47" stroke-width="4"/>
        <circle cx="50" cy="50" r="34" stroke-width="3"/>
      </g>
      <circle cx="50" cy="50" r="20" fill="var(--bg-color)" stroke="currentColor" stroke-width="3"/>
      <circle cx="50" cy="50" r="9" fill="var(--bg-color)" stroke="currentColor" stroke-width="3"/>
      <circle cx="50" cy="50" r="4" fill="var(--men)"/>
    </svg>
    <div class="titles">
      <p class="eyebrow">Broward County Darts Association</p>
      <h1>All Stars</h1>
    </div>
    <div class="spacer"></div>
    <div class="stamp" id="stamp"></div>
  </header>

  <div class="card" id="controls">
    <div class="row">
      <div class="field grow" style="max-width:320px">
        <label for="season">Season</label>
        <select class="input" id="season"></select>
      </div>
    </div>
    <div class="tabs" id="leagues" role="tablist" aria-label="League"></div>
    <div class="tabs sub" id="divisions" role="tablist" aria-label="Division"></div>
  </div>

  <div class="tiles" id="tiles"></div>

  <div class="tablewrap">
    <table id="board">
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="emptystate hide" id="empty"></div>
  </div>

  <div class="legend">
    <span><i class="gdot F"></i>Women</span>
    <span><i class="gdot M"></i>Men</span>
    <span>AS = All Stars points</span>
    <span>MPR = marks per round &middot; 3DA = 3-dart average</span>
    <span>Click any column to sort</span>
  </div>

</div>
<script type="module" src="assets/scoreboard.js"></script>
</body>
</html>
