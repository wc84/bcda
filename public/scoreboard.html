<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCDA All Stars</title>
<meta name="description" content="Broward County Darts Association All Stars standings.">
<meta name="theme-color" content="#084D29">
<link rel="stylesheet" href="assets/theme.css">
</head>
<body>

<header class="topbar">
  <div class="in">
    <div class="brand">
      <svg class="board" viewBox="0 0 100 100" aria-hidden="true" fill="none"
           stroke="currentColor" stroke-width="6">
        <circle cx="50" cy="50" r="44"/>
        <circle cx="50" cy="50" r="27"/>
        <circle cx="50" cy="50" r="8" fill="currentColor"/>
      </svg>
      <div>
        <div class="nm">BCDA All Stars</div>
        <div class="sub" id="season">Broward County Darts Association</div>
      </div>
      <div class="spacer"></div>
      <div class="when" id="when"></div>
    </div>
    <div class="seg" id="leagues" role="tablist" aria-label="League"></div>
  </div>
</header>

<div class="shell">

  <div class="pills" id="divisions" role="tablist" aria-label="Division"></div>

  <div class="tiles" id="tiles"></div>

  <div class="viewbar">
    <div class="chips grow" id="chips"></div>
    <div class="gtabs hide" id="gtabs"></div>
    <div class="vtoggle" id="vtoggle" data-view="cards" role="group" aria-label="Layout">
      <button type="button" id="viewCards" aria-pressed="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="6" rx="1.5"/>
          <rect x="3" y="14" width="18" height="6" rx="1.5"/>
        </svg>Cards</button>
      <button type="button" id="viewTable" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" aria-hidden="true">
          <path d="M3 5h18M3 12h18M3 19h18M9 5v14"/>
        </svg>Table</button>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="tablewrap hide" id="tablewrap">
    <table id="board">
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="emptystate hide" id="empty"></div>

  <div class="legend">
    <span>AS = All Stars points</span>
    <span>MPR = marks per round</span>
    <span>3DA = 3-dart average</span>
    <span id="legendHint">Tap a card for the full line</span>
  </div>

  <footer class="powered">
    <span>Powered by</span>
    <a href="https://smartdart.net" target="_blank" rel="noopener">
      <img src="assets/smartdart-logo.png" alt="SmartDart" width="300" height="229">
    </a>
  </footer>

</div>

<script type="module" src="assets/scoreboard.js"></script>
</body>
</html>
